# Default configuration for Anki Deck Generator
languages:
  en:
    display_name: English
    code: en
    wordfreq_code: en
    target_translation_code: en
  es:
    display_name: Spanish
    code: es
    wordfreq_code: es
    target_translation_code: en
  fr:
    display_name: French
    code: fr
    wordfreq_code: fr
    target_translation_code: en
  it:
    display_name: Italian
    code: it
    wordfreq_code: it
    target_translation_code: en
  de:
    display_name: German
    code: de
    wordfreq_code: de
    target_translation_code: en
  ru:
    display_name: Russian
    code: ru
    wordfreq_code: ru
    target_translation_code: en

providers:
  deepl:
    api_key: ""
    endpoint: "https://api-free.deepl.com/v2/translate"
  libretranslate:
    api_key: ""
    endpoint: "https://libretranslate.com/translate"
  responsivevoice:
    api_key: ""
    endpoint: "https://api.responsivevoice.org/v1/text:speech"
  azure_tts:
    region: ""
    api_key_env: "AZURE_TTS_KEY"
    region_env: "AZURE_TTS_REGION"
    endpoint: ""
    output_format: "audio-16khz-32kbitrate-mono-mp3"
    voice_map:
      en: "en-US-Andrew:DragonHDLatestNeural"
      es: "es-ES-Tristan:DragonHDLatestNeural"
      fr: "fr-FR-Remy:DragonHDLatestNeural"
      it: "it-IT-GiuseppeMultilingualNeural"
      de: "de-DE-ConradNeural"
      ru: "ru-RU-DmitryNeural"
  elevenlabs:
    api_key_env: "ELEVENLABS_API_KEY"
    voice_id: ""
    voice_name: ""
    voice_gender_preference: "male"
    model_id: "eleven_multilingual_v2"
    output_format: "mp3_44100_128"
  ai:
    providers:
      - "openrouter"
      - "groq"
    api_key: ""
    api_key_env: "ANKI_AI_KEY"
    temperature: 0.4
    openrouter:
      endpoint: "https://openrouter.ai/api/v1/chat/completions"
      models:
        - "meta-llama/llama-3.1-8b-instruct"
        - "qwen/qwen-turbo"
        - "meta-llama/llama-3.1-70b-instruct"
    groq:
      api_keys: []
      api_key_envs:
        - "GROQ_API_KEY_1"
        - "GROQ_API_KEY_2"
      endpoint: "https://api.groq.com/openai/v1/chat/completions"
      models:
        - "llama-3.1-8b-instant"
        - "llama-3.3-70b-versatile"

  tatoeba:
    endpoint: "https://tatoeba.org/eng/api_v0/search"
    exact_match: true
    native_only: true
    exclude_orphans: true
    exclude_unapproved: true
    max_pages: 3
    page_size: 20
  wordincontext:
    endpoint: "https://api.wordincontext.com"

definitions:
  policy_path: "definition_policy.yaml"

cache:
  path: "ankideck_generator/data/cache"
  autosave_every: 100

audio:
  enabled: true
  required: false
  output_dir: "ankideck_generator/data/audio"
  cleanup_after_export: true
  filename_style: "slug_hash"
  filename_slug_words: 4
  provider_order:
    - "azure_tts"
    - "gtts"
    - "responsivevoice"
    - "pyttsx3"
  language_overrides:
    ru:
      provider_order:
        - "azure_tts"
        - "elevenlabs"
        - "gtts"
        - "pyttsx3"
  use_legacy_cache: false

deck:
  name: "Anki Deck Generator"
  model_id: 1607392327
  deck_id: 2059400117
  css_path: "ankideck_generator/templates/styles.css"
  front_template: "ankideck_generator/templates/card_front.html"
  back_template: "ankideck_generator/templates/card_back.html"

runtime:
  timeout_sec: 10
  retries: 2
  lexicon_zipf_fallback_min: 0.0
  lexicon_zipf_fallback_min_by_language:
    ru: 3.0
  provider_timeout_overrides:
    ai: 12
    tatoeba: 6
    googletrans: 6
    gtts: 8
    wiktionary: 6
    deepl: 8
    libretranslate: 8
    azure_tts: 15
    elevenlabs: 15
    pyttsx3: 5
    responsivevoice: 10
  provider_retry_overrides:
    ai: 2
    tatoeba: 1
    googletrans: 1
    wiktionary: 1
    deepl: 1
    libretranslate: 1
    azure_tts: 0
    elevenlabs: 0
    responsivevoice: 0
  concurrency: 1
  test_concurrency: 3
  full_concurrency: 5
  audio_concurrency: 1
  test_audio_concurrency: 2
  full_audio_concurrency: 4
  sentence_ai_attempts: 3
  sentence_ai_attempts_full: 3
  definition_context_fallback: true
  definition_context_fallback_full: true
  low_yield_start_level_full: 2
  low_yield_min_attempts_full: 1500
  low_yield_min_acceptance_rate_full: 0.002
  low_yield_max_accepted_full: 6
  definition_word_fallback_full: true
  definition_context_first: true
  definition_candidates_limit: 5
  review_queue_path: "output/review_queue.json"
  quality_report_path: "output/quality_report.json"
  test_disable_audio: true
  seed: 42
  test_level_size: 10
  test_level_pool_multiplier: 1
  test_attempts_cap: true
  test_accept_all: true
  cleanup_generated_artifacts: true
  error_policy:
    test:
      max_soft_errors: 999
      hard:
        - definition_missing
        - translation_missing
        - sentence_missing
        - focus_not_in_sentence
        - invalid_focus_characters
        - invalid_sentence_characters
      soft:
        - sentence_length_invalid
        - sentence_profile_invalid
        - sentence_too_hard_for_level1
        - sentence_not_level2
        - sentence_too_easy_for_level3
        - definition_missing_pos
        - definition_nonsemantic
        - definition_wrong_language
        - source_definition_wrong_language
        - translation_same_as_source
        - translation_wrong_language
        - ipa_missing
        - invalid_ipa
        - word_audio_missing
        - sentence_audio_missing
        - duplicate_focus
        - duplicate_sentence
        - function_word
        - focus_not_in_lexicon
        - definition_too_similar_translation
    full:
      max_soft_errors: 1
      hard:
        - function_word
        - focus_not_in_lexicon
        - definition_missing
        - definition_missing_pos
        - definition_nonsemantic
        - definition_wrong_language
        - translation_missing
        - translation_same_as_source
        - translation_wrong_language
        - sentence_missing
        - focus_not_in_sentence
        - sentence_wrong_language
        - invalid_focus_characters
        - invalid_sentence_characters
        - duplicate_focus
        - duplicate_sentence
        - ipa_missing
        - invalid_ipa
      soft:
        - sentence_length_invalid
        - sentence_profile_invalid
        - sentence_too_hard_for_level1
        - sentence_not_level2
        - sentence_too_easy_for_level3
        - source_definition_wrong_language
        - definition_too_similar_translation
        - word_audio_missing
        - sentence_audio_missing
  full_level_size: 1000
  ai_max_calls_per_word: 10
  ai_max_calls_per_field: 4
  level_pool_multiplier: 8
  max_attempts_per_level_test: 300
  max_attempts_per_level_full: 8000
  exclude_closed_class_words: true
  cache_validation_version: 4
  enforce_translation_language: true
  sentence_rewrite_from_web: true
  level_validation_mode: "profile_hard_zipf_soft"
  strict_quality: true
  profiles:
    test:
      timeout_sec: 4
      retries: 0
      ai_max_calls_per_word: 6
      ai_max_calls_per_field: 2
    full:
      timeout_sec: 10
      retries: 0
      ai_max_calls_per_word: 10
      ai_max_calls_per_field: 4
